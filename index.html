<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>S Shop</title>

    <link rel="stylesheet" href="design.css">

</head>

<body>

    <!-- =========================
         Header
    ========================== -->

    <header class="head">

        <a href="index.html" style="text-decoration: none;">
            <h1>S Shop</h1>
        </a>

        <!-- Navigation -->

        <nav>

            <a href="./index.html">Home</a>

            <a href="./product.html">Products</a>

            <a href="./about.html">About Us</a>

            <a href="./favorite.html">
                ❤️ Favorites
            </a>

            <a href="./cart.html">
                🛒 Cart
                <span id="cartCount">0</span>
            </a>

        </nav>

        <!-- Search -->

        <form class="search-form" id="searchForm">

            <input type="search" id="searchInput" placeholder="Search items" autocomplete="off">

            <button type="submit">
                🔍
            </button>

        </form>

    </header>

    <!-- =========================
         Main
    ========================== -->

    <main class="main">

        <!-- Hero -->

        <div>

            <img class="hero" src="./media/ChatGPT Image Sep 6, 2026, 10_16_27 PM.png" alt="S Shop Gaming">

        </div>

        <!-- =========================
             Products
        ========================== -->

        <div class="products" id="products">

            <!-- Gaming PC -->

            <div class="product-card" data-name="Gaming PC" data-price="200 $" data-category="Gaming PC"
                data-description="A powerful gaming PC designed for gaming and everyday use.">

                <button class="favorite-button" type="button" aria-label="Add to favorites">
                    ♡
                </button>

                <img src="./media/pc.jpg" alt="Gaming PC">

                <h2>Gaming PC</h2>

                <p class="price">
                    200 $
                </p>

            </div>

            <!-- PS5 -->
            <div class="product-card" data-name="PS5" data-price="399 $" data-category="Console"
                data-description="PlayStation 5 gaming console with powerful performance and fast loading.">

                <button class="favorite-button" type="button" aria-label="Add to favorites">
                    ♡
                </button>

                <img src="./media/PS5.jpg" alt="PS5">

                <h2>PS5</h2>

                <p class="price">
                    399 $
                </p>

            </div>


            <!-- Xbox -->

            <div class="product-card" data-name="Xbox Series X" data-price="399 $" data-category="Console"
                data-description="Xbox Series X with high performance, fast loading and excellent gaming experience.">

                <button class="favorite-button" type="button" aria-label="Add to favorites">
                    ♡
                </button>

                <img src="./media/xbox.jpg" alt="Xbox Series X">

                <h2>Xbox Series X</h2>

                <p class="price">
                    399 $
                </p>

            </div>

            <!-- Headset -->

            <div class="product-card" data-name="Gaming Headset" data-price="89 $" data-category="Headset"
                data-description="Gaming headset with clear sound and comfortable design for long gaming sessions.">

                <button class="favorite-button" type="button" aria-label="Add to favorites">
                    ♡
                </button>

                <img src="./media/Headset.jpg" alt="Gaming Headset">

                <h2>Gaming Headset</h2>

                <p class="price">
                    89 $
                </p>

            </div>


            <!-- Keyboard -->

            <div class="product-card" data-name="Gaming Keyboard" data-price="75 $" data-category="Keyboard"
                data-description="Mechanical gaming keyboard with RGB lighting and responsive keys.">

                <button class="favorite-button" type="button" aria-label="Add to favorites">
                    ♡
                </button>

                <img src="./media/keyboard.jpg" alt="Gaming Keyboard">

                <h2>Gaming Keyboard</h2>

                <p class="price">
                    75 $
                </p>

            </div>


            <!-- Mouse -->

            <div class="product-card" data-name="Gaming Mouse" data-price="45 $" data-category="Mouse"
                data-description="Gaming mouse with accurate sensor, fast response and comfortable design.">

                <button class="favorite-button" type="button" aria-label="Add to favorites">
                    ♡
                </button>

                <img src="./media/mouse.jpg" alt="Gaming Mouse">

                <h2>Gaming Mouse</h2>

                <p class="price">
                    45 $
                </p>

            </div>


        </div>


    </main>

    <!-- =========================
         Product Popup
    ========================== -->

    <div class="popup" id="productPopup">

        <div class="popup-content">


            <!-- Close -->

            <button class="close-popup" id="closePopup" type="button">
                ✕
            </button>


            <!-- Product Image -->

            <img id="popupImage" src="" alt="Product">


            <!-- Product Information -->

            <div class="popup-info">

                <h2 id="popupName"></h2>

                <p class="popup-price" id="popupPrice"></p>

                <p id="popupCategory"></p>

                <p id="popupDescription"></p>


                <!-- =========================
                     Rating System
                ========================== -->

                <div class="rating-section">

                    <h3>Rate this product</h3>

                    <div class="stars" id="ratingStars">

                        <button type="button" data-rating="1">★</button>
                        <button type="button" data-rating="2">★</button>
                        <button type="button" data-rating="3">★</button>
                        <button type="button" data-rating="4">★</button>
                        <button type="button" data-rating="5">★</button>

                    </div>

                    <p id="ratingText">No rating yet</p>

                </div>


                <!-- Popup Actions -->

                <div class="popup-actions">

                    <button class="favorite-popup-button" id="favoritePopupButton" type="button">
                        💛 Add to Favorites
                    </button>

                    <button class="buy-button" id="addToCartButton" type="button">
                        🛒 Add to Cart
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- =========================
         JavaScript
    ========================== -->

    <script>


        // =========================
        // Search
        // =========================

        const searchForm =
            document.getElementById("searchForm");

        const searchInput =
            document.getElementById("searchInput");


        searchForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();


                const searchText =
                    searchInput.value.trim();


                if (searchText === "") {

                    window.location.href =
                        "product.html";

                    return;

                }


                window.location.href =
                    "product.html?search=" +
                    encodeURIComponent(searchText);

            }
        );

        // =========================
        // Products
        // =========================

        const products =
            document.querySelectorAll(
                ".product-card"
            );


        // =========================
        // Popup
        // =========================

        const popup =
            document.getElementById(
                "productPopup"
            );

        const popupImage =
            document.getElementById(
                "popupImage"
            );

        const popupName =
            document.getElementById(
                "popupName"
            );

        const popupPrice =
            document.getElementById(
                "popupPrice"
            );

        const popupCategory =
            document.getElementById(
                "popupCategory"
            );

        const popupDescription =
            document.getElementById(
                "popupDescription"
            );

        const closePopup =
            document.getElementById(
                "closePopup"
            );


        // =========================
        // Favorites
        // =========================

        let favorites =
            JSON.parse(
                localStorage.getItem(
                    "sShopFavorites"
                )
            ) || [];


        let currentFavoriteName = "";


        function saveFavorites() {

            localStorage.setItem(
                "sShopFavorites",
                JSON.stringify(
                    favorites
                )
            );

        }

        function isFavorite(name) {

            return favorites.includes(
                name
            );

        }

        function updateFavoriteButtons() {

            products.forEach(
                function (product) {

                    const name =
                        product.dataset.name;

                    const button =
                        product.querySelector(
                            ".favorite-button"
                        );


                    if (!button) {
                        return;
                    }


                    if (isFavorite(name)) {

                        button.textContent =
                            "♥";

                        button.classList.add(
                            "favorite-active"
                        );

                        button.setAttribute(
                            "aria-label",
                            "Remove from favorites"
                        );

                    }

                    else {

                        button.textContent =
                            "♡";

                        button.classList.remove(
                            "favorite-active"
                        );

                        button.setAttribute(
                            "aria-label",
                            "Add to favorites"
                        );

                    }

                }
            );


            // Popup Favorite Button

            if (
                currentFavoriteName !== ""
            ) {

                if (
                    isFavorite(
                        currentFavoriteName
                    )
                ) {

                    favoritePopupButton.textContent =
                        "♥ Remove from Favorites";

                    favoritePopupButton.classList.add(
                        "favorite-active"
                    );

                }

                else {

                    favoritePopupButton.textContent =
                        "♡ Add to Favorites";

                    favoritePopupButton.classList.remove(
                        "favorite-active"
                    );

                }

            }

        }


        function toggleFavorite(name) {

            if (
                isFavorite(name)
            ) {

                favorites =
                    favorites.filter(
                        function (item) {

                            return item !== name;

                        }
                    );

            }

            else {

                favorites.push(
                    name
                );

            }


            saveFavorites();

            updateFavoriteButtons();

        }

        // =========================
        // Popup Favorite
        // =========================

        const favoritePopupButton =
            document.getElementById(
                "favoritePopupButton"
            );


        favoritePopupButton.addEventListener(
            "click",
            function (event) {

                event.stopPropagation();

                if (
                    currentFavoriteName === ""
                ) {
                    return;
                }

                toggleFavorite(
                    currentFavoriteName
                );

            }
        );

        // =========================
        // Rating System
        // =========================

        const ratingStars =
            document.querySelectorAll(
                "#ratingStars button"
            );

        const ratingText =
            document.getElementById(
                "ratingText"
            );

        let ratings =
            JSON.parse(
                localStorage.getItem(
                    "sShopRatings"
                )
            ) || {};

        let currentRatingProduct = "";

        function saveRatings() {

            localStorage.setItem(
                "sShopRatings",
                JSON.stringify(
                    ratings
                )
            );

        }

        function updateRating() {

            const rating =
                ratings[
                currentRatingProduct
                ] || 0;


            ratingStars.forEach(
                function (star) {

                    const value =
                        Number(
                            star.dataset.rating
                        );


                    if (
                        value <= rating
                    ) {

                        star.classList.add(
                            "active"
                        );

                    }

                    else {

                        star.classList.remove(
                            "active"
                        );

                    }

                }
            );


            if (
                rating === 0
            ) {

                ratingText.textContent =
                    "No rating yet";

            }

            else {

                ratingText.textContent =
                    rating +
                    " / 5 ⭐";

            }

        }

        ratingStars.forEach(
            function (star) {

                star.addEventListener(
                    "click",
                    function (event) {

                        event.stopPropagation();


                        const rating =
                            Number(
                                star.dataset.rating
                            );


                        if (
                            currentRatingProduct ===
                            ""
                        ) {

                            return;

                        }


                        ratings[
                            currentRatingProduct
                        ] = rating;


                        saveRatings();

                        updateRating();

                    }
                );

            }
        );


        // =========================
        // Open Popup
        // =========================

        products.forEach(
            function (product) {


                product.addEventListener(
                    "click",
                    function () {


                        const name =
                            product.dataset.name;

                        const price =
                            product.dataset.price;

                        const category =
                            product.dataset.category;

                        const description =
                            product.dataset.description;

                        const image =
                            product.querySelector(
                                "img"
                            ).src;


                        popupName.textContent =
                            name;

                        popupPrice.textContent =
                            price;

                        popupCategory.textContent =
                            "Category: " +
                            category;

                        popupDescription.textContent =
                            description;

                        popupImage.src =
                            image;


                        currentFavoriteName =
                            name;

                        currentRatingProduct =
                            name;


                        updateFavoriteButtons();

                        updateRating();


                        popup.classList.add(
                            "active"
                        );

                    }
                );


                // =========================
                // Card Favorite Button
                // =========================

                const favoriteButton =
                    product.querySelector(
                        ".favorite-button"
                    );


                favoriteButton.addEventListener(
                    "click",
                    function (event) {

                        event.stopPropagation();


                        toggleFavorite(
                            product.dataset.name
                        );

                    }
                );

            }
        );


        // =========================
        // Close Popup
        // =========================

        closePopup.addEventListener(
            "click",
            function () {

                popup.classList.remove(
                    "active"
                );

            }
        );


        // =========================
        // Close Outside
        // =========================

        popup.addEventListener(
            "click",
            function (event) {

                if (
                    event.target === popup
                ) {

                    popup.classList.remove(
                        "active"
                    );

                }

            }
        );


        // =========================
        // Shopping Cart
        // =========================

        let cart =
            JSON.parse(
                localStorage.getItem(
                    "sShopCart"
                )
            ) || [];


        const cartCount =
            document.getElementById(
                "cartCount"
            );


        const addToCartButton =
            document.getElementById(
                "addToCartButton"
            );


        // =========================
        // Save Cart
        // =========================

        function saveCart() {

            localStorage.setItem(
                "sShopCart",
                JSON.stringify(cart)
            );

        }


        // =========================
        // Update Cart Count
        // =========================

        function updateCartCount() {

            let totalItems = 0;


            cart.forEach(
                function (item) {

                    totalItems +=
                        Number(
                            item.quantity
                        ) || 0;

                }
            );


            cartCount.textContent =
                totalItems;

        }


        // =========================
        // Add To Cart
        // =========================

        addToCartButton.addEventListener(
            "click",
            function (event) {

                event.stopPropagation();


                const name =
                    popupName.textContent;

                const price =
                    popupPrice.textContent;

                const category =
                    popupCategory.textContent
                        .replace(
                            "Category: ",
                            ""
                        );

                const description =
                    popupDescription.textContent;

                const image =
                    popupImage.src;


                const existingProduct =
                    cart.find(
                        function (item) {

                            return item.name === name;

                        }
                    );


                if (existingProduct) {

                    existingProduct.quantity++;

                }

                else {

                    cart.push({

                        name:
                            name,

                        price:
                            price,

                        category:
                            category,

                        description:
                            description,

                        image:
                            image,

                        quantity:
                            1

                    });

                }


                saveCart();

                updateCartCount();


                // Button Animation

                addToCartButton.textContent =
                    "✓ Added to Cart";

                addToCartButton.style.background =
                    "#8a2be2";

                addToCartButton.style.color =
                    "white";


                setTimeout(
                    function () {

                        addToCartButton.textContent =
                            "🛒 Add to Cart";

                        addToCartButton.style.background =
                            "orange";

                        addToCartButton.style.color =
                            "black";

                    },
                    1200
                );

            }
        );


        // =========================
        // Start
        // =========================

        updateCartCount();

        updateFavoriteButtons();


    </script>


</body>

</html>
